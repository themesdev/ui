name: Add your site to the showcase
description: Built something with themes.dev UI? Share it and we add it to the README.
title: "Showcase: "
labels: ["showcase"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing. We check every site and add the ones that are live and public to the "Built with themes.dev UI" list in the README, with a link to your site.
  - type: input
    id: url
    attributes:
      label: Site URL
      placeholder: https://
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Name to show
      description: Your site, product or company, as it should appear in the list.
    validations:
      required: true
  - type: textarea
    id: used
    attributes:
      label: What did you use?
      description: Blocks, components, templates or the Astro kit. A line is enough.
      placeholder: hero, pricing and faq on a Next.js landing page
  - type: input
    id: credit
    attributes:
      label: Link credit (optional)
      description: Your X or GitHub handle, if you want it next to the site.
  - type: checkboxes
    id: ok
    attributes:
      label: Permission
      options:
        - label: You may list this site, with a link, in the README of this repo.
          required: true
